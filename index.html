<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lattafa Lail Maleki Perfume - Special Offer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding: 50px;
        }
        .card {
            background: white;
            max-width: 400px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
        }
        h2 { color: #333; }
        p { color: #666; font-size: 14px; }
        .btn {
            display: block;
            background-color: #f68b1e;
            color: white;
            text-decoration: none;
            padding: 15px;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
            border: none;
            width: 100%;
            font-size: 16px;
        }
        .btn:hover { background-color: #e07a14; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Lattafa Lail Maleki Perfume</h2>
        <p>Click below to claim your deal. Your consultant tracking will be applied automatically.</p>
        
        <!-- Button triggers the background tracking and immediate redirect -->
        <button onclick="openJumiaDeal()" class="btn">View Product on Jumia</button>
    </div>

    <script>
        function openJumiaDeal() {
            // 1. Create a hidden iframe to silently trigger the JForce tracker cookie in the background
            var tracker = document.createElement('iframe');
            tracker.style.display = 'none';
            tracker.src = 'https://jforce.jumia.co.ke/s/279FZYk';
            document.body.appendChild(tracker);

            // 2. Wait a split second for the tracker to fire, then take the user straight to the product page
            setTimeout(function() {
                window.location.href = "https://www.jumia.co.ke/lattafa-lail-maleki-perfume-327898509.html";
            }, 600);
        }
    </script>

</body>
